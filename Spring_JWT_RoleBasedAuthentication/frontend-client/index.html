<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stateless JWT REST API Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #95a5a6; }
        button.secondary:hover { background-color: #7f8c8d; }
        button.danger { background-color: #e74c3c; }
        button.danger:hover { background-color: #c0392b; }
        .console {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            white-space: pre-wrap;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .authenticated { background-color: #2ecc71; color: white; }
        .anonymous { background-color: #7f8c8d; color: white; }
    </style>
</head>
<body>

    <h1>Stateless JWT Authentication Dashboard</h1>
    
    <div class="card">
        <h2>Connection Status: <span id="statusBadge" class="status-badge anonymous">Anonymous</span></h2>
        <p>Token status: <span id="tokenStatus">No token found in localStorage.</span></p>
        <button id="logoutBtn" class="danger" style="display:none;">Clear Token (Logout)</button>
    </div>

    <div class="card" id="loginCard">
        <h2>Authentication Layer</h2>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" value="admin">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" value="admin123">
        </div>
        <button id="loginBtn">Authenticate & Get Token</button>
    </div>

    <div class="card">
        <h2>Protected Resources Integration Gateway</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="queryAdminBtn">Query Admin Endpoint</button>
            <button id="queryUserBtn" class="secondary">Query User Endpoint</button>
        </div>
    </div>

    <div class="card">
        <h2>Console Output & Network Traces</h2>
        <div id="consoleLog" class="console">[System initialized. Awaiting user action...]</div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const consoleLog = document.getElementById('consoleLog');
        
        function log(message, isError = false) {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = isError ? '[ERROR]' : '[INFO]';
            consoleLog.innerText += `\n[${timestamp}] ${prefix} ${message}`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function updateUIState() {
            const token = localStorage.getItem('jwt_token');
            const statusBadge = document.getElementById('statusBadge');
            const tokenStatus = document.getElementById('tokenStatus');
            const logoutBtn = document.getElementById('logoutBtn');
            const loginCard = document.getElementById('loginCard');

            if (token) {
                statusBadge.innerText = 'Authenticated';
                statusBadge.className = 'status-badge authenticated';
                tokenStatus.innerText = 'Valid JWT active inside localStorage asset vault.';
                logoutBtn.style.display = 'inline-block';
                loginCard.style.display = 'none';
            } else {
                statusBadge.innerText = 'Anonymous';
                statusBadge.className = 'status-badge anonymous';
                tokenStatus.innerText = 'No token found in localStorage.';
                logoutBtn.style.display = 'none';
                loginCard.style.display = 'block';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log(`Attempting POST authentication wrapper context to ${API_URL}/auth/login...`);
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP rejection status pipeline: ${response.status}`);
                }
                
                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    log('JWT token securely committed inside browser local storage vaults.');
                    updateUIState();
                } else {
                    log('Server authentication completed but no payload token attribute mapped.', true);
                }
            } catch (err) {
                log(`Authentication chain critical fault: ${err.message}`, true);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('jwt_token');
            log('JWT local cache discarded. Client security scope dropped back to anonymous.');
            updateUIState();
        });

        async function querySecureEndpoint(endpointPath) {
            const token = localStorage.getItem('jwt_token');
            log(`Attempting secure GET request wrapper payload to ${API_URL}${endpointPath}...`);
            
            try {
                const response = await fetch(`${API_URL}${endpointPath}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': token ? `Bearer ${token}` : '',
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`Response Network Node metadata returned with status: ${response.status}`);
                
                if (response.status === 403 || response.status === 401) {
                    log(`Access explicitly denied by Spring Security layer [HTTP ${response.status}]`, true);
                    return;
                }
                
                const data = await response.json();
                log(`Payload content successfully extracted from secure cluster: ${JSON.stringify(data)}`);
            } catch (err) {
                log(`Fatal connection breakdown / runtime check error: ${err.message}`, true);
            }
        }

        document.getElementById('queryAdminBtn').addEventListener('click', () => querySecureEndpoint('/admin/panel'));
        document.getElementById('queryUserBtn').addEventListener('click', () => querySecureEndpoint('/user/dashboard'));

        // Initial setup run
        updateUIState();
    </script>
</body>
</html>
